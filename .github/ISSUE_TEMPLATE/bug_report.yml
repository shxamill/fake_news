name: Bug report
description: Report a reproducible issue in the application or model workflow.
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: "Do not include private news text, personal information, credentials, or unredacted logs."
  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: Include the expected result and actual result.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: input
    id: python
    attributes:
      label: Python version
    validations:
      required: false
  - type: textarea
    id: logs
    attributes:
      label: Error output
      description: Redact secrets and personal information.
    validations:
      required: false
