name: Feature request
description: Suggest an improvement to the application or ML workflow.
title: "[Feature]: "
body:
  - type: textarea
    id: need
    attributes:
      label: Problem or user need
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed change
    validations:
      required: true
  - type: textarea
    id: evaluation
    attributes:
      label: Evaluation and safety considerations
      description: How could the change be tested, and what new limitations might it introduce?
    validations:
      required: false
